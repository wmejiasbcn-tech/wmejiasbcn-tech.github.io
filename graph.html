<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>WAIPL Graph</title>
  <meta http-equiv="refresh" content="0;url=https://graph-waipl.vercel.app/" />
  <link rel="canonical" href="https://graph.waipl.dev/" />
  <script>
    (function () {
      var live = "https://graph-waipl.vercel.app/";
      var canonical = "https://graph.waipl.dev/";
      fetch(canonical, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(1200) })
        .then(function () { location.replace(canonical); })
        .catch(function () { location.replace(live); });
    })();
  </script>
</head>
<body>
  <p><a href="https://graph-waipl.vercel.app/">Entrar al grafo vivo</a></p>
</body>
</html>
