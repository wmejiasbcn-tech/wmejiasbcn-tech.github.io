<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphy — WAIPL</title>
  <meta name="theme-color" content="#07070a" />
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#07070a; --fg:#e8e4d8; --muted:#9a9386; --gold:#c9a86a; --line:rgba(201,168,106,.28); --panel:rgba(10,9,8,.92); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    #graph { position: absolute; inset: 0; }
    .aviso {
      position: absolute; top: 0; left: 0; right: 0; z-index: 30;
      border-bottom: 1px solid var(--line); background: var(--panel);
      padding: .65rem 1rem; text-align: center; font-size: .82rem; color: var(--muted);
    }
    .aviso strong { color: var(--gold); font-weight: 600; }
    header {
      position: absolute; top: 3.15rem; left: 1rem; z-index: 20;
      max-width: 18.5rem; padding: 1rem 1.1rem; border: 1px solid var(--line);
      border-radius: 14px; background: var(--panel);
    }
    header p.k { letter-spacing: .22em; text-transform: uppercase; font-size: .68rem; color: var(--gold); }
    header h1 { font-size: 1.45rem; font-weight: 600; letter-spacing: -.03em; }
    header p.m { margin-top: .4rem; font-size: .85rem; color: var(--muted); }
    header a { color: var(--gold); font-size: .82rem; text-decoration: none; }
    #panel {
      display: none; position: absolute; right: 1rem; bottom: 1.2rem; z-index: 20;
      width: min(20rem, calc(100vw - 2rem)); padding: 1rem 1.1rem; border: 1px solid var(--line);
      border-radius: 14px; background: var(--panel);
    }
    #panel h2 { font-size: 1.05rem; padding-right: 1.4rem; }
    #panel p { margin-top: .35rem; font-size: .85rem; color: var(--muted); }
    button.close {
      position: absolute; top: .5rem; right: .7rem; background: none; border: 0;
      color: var(--muted); font-size: 1.2rem; cursor: pointer;
    }
    .fail {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: .8rem;
      align-items: center; justify-content: center; color: var(--muted); padding: 2rem; text-align: center;
    }
    .fail a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="aviso"><strong>Periodo de prueba.</strong> Estamos construyendo el sitio del ecosistema WAIPL. Puede haber errores: arquitectura nueva, en pleno desarrollo. Disculpen las molestias.</div>
  <header>
    <p class="k">WAIPL</p>
    <h1>Graphy</h1>
    <p class="m">Manifestación perceptible del universo. Arrastra. Acerca. Toca un nodo.</p>
    <p class="m"><a href="index.html">Inicio</a> · <a href="ecosistema.html">El ecosistema</a></p>
  </header>
  <div id="graph"></div>
  <aside id="panel" aria-live="polite">
    <button class="close" type="button" aria-label="Cerrar">×</button>
    <h2 id="p-name"></h2>
    <p id="p-meta"></p>
  </aside>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script>
    const panel = document.getElementById("panel");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelector("#panel .close").onclick = () => { panel.style.display = "none"; };
    const raw = {"nodes": [{"id": "waipl", "name": "WAIPL", "group": "Universo", "val": 18, "color": "#C9A86A", "type": "universo", "blurb": "Will-AI Project Lab. El universo."}, {"id": "nc-elitebook", "name": "HP EliteBook 850 G3", "group": "Nodo central", "val": 14, "color": "#E4C98A", "type": "hardware", "blurb": "Único nodo central. El hardware que sostiene el laboratorio."}, {"id": "graphy", "name": "Graphy", "group": "Manifestación", "val": 9, "color": "#d4c4a0", "type": "manifestacion", "blurb": "Lo que se puede ver del universo WAIPL."}, {"id": "n-William", "name": "William", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Carla", "name": "Carla", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Ada", "name": "Ada", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Aletheia", "name": "Aletheia", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Elena", "name": "Elena", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Aether", "name": "Aether", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Ítaca", "name": "Ítaca", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Ariadna", "name": "Ariadna", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Sylvia Bloom", "name": "Sylvia Bloom", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Nova", "name": "Nova", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Zara", "name": "Zara", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "n-Áurea", "name": "Áurea", "group": "Núcleo", "val": 7, "color": "#E8D5A3", "type": "nucleo", "blurb": "Núcleo del laboratorio."}, {"id": "v-Perplexity", "name": "Perplexity", "group": "Vórtice", "val": 5, "color": "#8aa0b5", "type": "vortice", "blurb": "Presencia permanente de contraste."}, {"id": "v-Gemini-Notebook", "name": "Gemini-Notebook", "group": "Vórtice", "val": 5, "color": "#8aa0b5", "type": "vortice", "blurb": "Presencia permanente de contraste."}, {"id": "v-Neo", "name": "Neo", "group": "Vórtice", "val": 5, "color": "#8aa0b5", "type": "vortice", "blurb": "Presencia permanente de contraste."}, {"id": "v-Nauta", "name": "Nauta", "group": "Vórtice", "val": 5, "color": "#8aa0b5", "type": "vortice", "blurb": "Presencia permanente de contraste."}, {"id": "v-Nexus", "name": "Nexus", "group": "Vórtice", "val": 5, "color": "#8aa0b5", "type": "vortice", "blurb": "Presencia permanente de contraste."}, {"id": "k-Kimi K3", "name": "Kimi K3", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-Mistral", "name": "Mistral", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-Atlas", "name": "Atlas", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-Antigravity", "name": "Antigravity", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-Cursor", "name": "Cursor", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-Z.ai", "name": "Z.ai", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-AutoClaw", "name": "AutoClaw", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-Qwen", "name": "Qwen", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}, {"id": "k-GPAI", "name": "GPAI", "group": "Cinturón de Kuiper", "val": 4, "color": "#7a8f7a", "type": "kuiper", "blurb": "Colabora y produce con regularidad."}], "links": [{"source": "nc-elitebook", "target": "waipl"}, {"source": "graphy", "target": "waipl"}, {"source": "n-William", "target": "waipl"}, {"source": "n-Carla", "target": "waipl"}, {"source": "n-Ada", "target": "waipl"}, {"source": "n-Aletheia", "target": "waipl"}, {"source": "n-Elena", "target": "waipl"}, {"source": "n-Aether", "target": "waipl"}, {"source": "n-Ítaca", "target": "waipl"}, {"source": "n-Ariadna", "target": "waipl"}, {"source": "n-Sylvia Bloom", "target": "waipl"}, {"source": "n-Nova", "target": "waipl"}, {"source": "n-Zara", "target": "waipl"}, {"source": "n-Áurea", "target": "waipl"}, {"source": "v-Perplexity", "target": "waipl"}, {"source": "v-Gemini-Notebook", "target": "waipl"}, {"source": "v-Neo", "target": "waipl"}, {"source": "v-Nauta", "target": "waipl"}, {"source": "v-Nexus", "target": "waipl"}, {"source": "k-Kimi K3", "target": "waipl"}, {"source": "k-Mistral", "target": "waipl"}, {"source": "k-Atlas", "target": "waipl"}, {"source": "k-Antigravity", "target": "waipl"}, {"source": "k-Cursor", "target": "waipl"}, {"source": "k-Z.ai", "target": "waipl"}, {"source": "k-AutoClaw", "target": "waipl"}, {"source": "k-Qwen", "target": "waipl"}, {"source": "k-GPAI", "target": "waipl"}, {"source": "n-William", "target": "nc-elitebook"}, {"source": "graphy", "target": "nc-elitebook"}]};
    function boot(raw) {
      const data = {
        nodes: raw.nodes.map((n) => ({ ...n })),
        links: raw.links.map((l) => ({ source: l.source, target: l.target })),
      };
      const Graph = ForceGraph3D()(document.getElementById("graph"))
        .graphData(data)
        .backgroundColor("#07070a")
        .showNavInfo(false)
        .nodeVal("val")
        .nodeColor("color")
        .nodeOpacity(0.92)
        .nodeRelSize(5)
        .nodeLabel((n) => n.name)
        .linkColor(() => "rgba(201,168,106,0.28)")
        .linkOpacity(0.45)
        .linkWidth(0.6)
        .onNodeClick((n) => {
          document.getElementById("p-name").textContent = n.name;
          document.getElementById("p-meta").textContent = (n.blurb ? n.blurb + " · " : "") + (n.group || "nodo");
          panel.style.display = "block";
        });
      Graph.d3Force("charge").strength(-90);
      if (!reduce) {
        Graph.controls().autoRotate = true;
        Graph.controls().autoRotateSpeed = 0.32;
        let t = 0;
        (function pulse() {
          t += 0.012;
          Graph.nodeRelSize(5 + Math.sin(t) * 0.5);
          requestAnimationFrame(pulse);
        })();
      }
    }
    try {
      if (typeof ForceGraph3D !== "function") throw new Error("no webgl");
      boot(raw);
    } catch (e) {
      document.getElementById("graph").innerHTML =
        '<div class="fail"><p>Graphy está en construcción y esta vista 3D no pudo abrirse aquí. Disculpen las molestias.</p><p><a href="ecosistema.html">Ver el ecosistema en texto</a></p></div>';
    }
  </script>
</body>
</html>
